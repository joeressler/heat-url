[workspace]
authors = ["Joseph Ressler <joe.a.ressler@gmail.com>"]
channels = [
    "https://conda.modular.com/max",
    "conda-forge",
    "https://repo.prefix.dev/modular-community",
]
name = "heat-url"
description = "URI and URL parsing for Mojo (WHATWG and RFC 3986), with native IDNA."
platforms = ["linux-64"]
version = "1.0.0"

[tasks]
test = "bash scripts/run-tests.sh"
fmt = "mojo format src test examples conda.recipe"
example = "mojo run -I src examples/basic.mojo"

[dependencies]
mojo = ">=1.0.0,<2"
# Tests-only WPT JSON parser. Do not import from src/heat_url.
emberjson = ">=0.3.4,<0.4"
