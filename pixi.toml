[workspace]
authors = ["Joseph Ressler <joe.a.ressler@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "heat-url"
description = "Standardized, robust URI/URL parsing for Mojo: percent-encoding, query parameters, and IDNA."
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = "bash scripts/run-tests.sh"
fmt = "mojo format src test"

[dependencies]
mojo = ">=1.0.0,<2"

# WPT JSON is parsed by vendored ehsanmok/json v0.3.0 (third_party/json),
# CPU parser only. The published git package pulls MAX + simdjson + GPU.
