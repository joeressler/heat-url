name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C linker
        run: sudo apt-get update && sudo apt-get install -y gcc
      - uses: prefix-dev/setup-pixi@v0.8.8
      - name: Tests
        run: pixi run test
      - name: Format
        run: pixi run fmt && git diff --exit-code
